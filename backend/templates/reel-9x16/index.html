<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ground: #0f1013; --ink: #ffffff; --mute: #9aa0ab; --accent: #1b6ef3; --accent2: #ff8a1f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); font-family: "Inter", sans-serif; color: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; }
      .hd { position: absolute; left: 0; width: 100%; text-align: center; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; white-space: nowrap; }
      .w { display: inline-block; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="__DUR__" data-track-index="0" data-width="1080" data-height="1920" style="z-index:0"></div>
      <div id="s1" data-composition-id="scene-1" data-composition-src="compositions/scene-1.html" data-start="0" data-duration="__DUR__" data-track-index="1" data-width="1080" data-height="1920" style="z-index:2"></div>
      <!-- voiceover / music / sfx go here last (house rule: sound after picture approval) -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, __DUR__);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
