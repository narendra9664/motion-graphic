<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="../assets/fonts.css" />
<link rel="stylesheet" href="../assets/brand.css" />
<script src="../assets/gsap.min.js"></script>
<style>
  /* 01-hook — cream world, six visit ticks, giant numeral. Film window: 0 – 4.49 (local time == film) */
  #hook-root { font-family: "inter-variable", sans-serif; color: var(--ink); }

  #ovl { left: 90px; top: 330px; }

  #big6 {
    left: 90px;
    top: 540px;
  }
  .big6-n {
    font-family: "anton", sans-serif;
    font-size: 430px;
    line-height: 0.9;
  }

  #v-label {
    left: 90px;
    top: 1010px;
  }
  .v-label-inner {
    font-family: "anton", sans-serif;
    font-size: 62px;
    letter-spacing: 0.02em;
  }

  #place {
    left: 90px;
    top: 1066px;
  }
  .place-inner {
    display: inline-block;
    padding: 12px 26px;
    border: 1.5px solid var(--hair);
    border-radius: 999px;
    background: var(--paper);
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.02em;
  }

  /* ticks column — five ink, sixth gold */
  #ticks {
    right: 90px;
    top: 540px;
    width: 150px;
    height: 560px;
  }
  .tick {
    width: 150px;
    height: 64px;
    margin-bottom: 34px;
    border-radius: 16px;
    background: var(--ink);
  }
  .tick.gold { background: var(--gold); box-shadow: 0 10px 26px rgba(255, 215, 0, 0.32); }

  #warm-glow {
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(620px 620px at 78% 38%, rgba(255, 215, 0, 0.10), transparent 70%),
      radial-gradient(900px 900px at 10% 90%, rgba(0, 128, 255, 0.05), transparent 65%);
  }
  #bg { inset: 0; }
</style>
</head>
<body>
<div id="hook-root" data-composition-id="hook" data-start="0" data-duration="4.49" data-width="1080" data-height="1920">
  <div id="bg" class="clip" data-start="0" data-duration="4.49" data-track-index="0"><div id="warm-glow"></div></div>

  <div id="ovl" class="clip" data-start="0" data-duration="4.49" data-track-index="1">
    <div class="overline ovl-inner">FRONTDESK AI &middot; HOT LEAD</div>
  </div>

  <div id="big6" class="clip" data-start="0" data-duration="4.49" data-track-index="2">
    <div class="big6-n big6-inner">6</div>
  </div>

  <div id="v-label" class="clip" data-start="0" data-duration="4.49" data-track-index="3">
    <div class="v-label-inner">VISITS <span style="color: var(--dim)">THIS WEEK</span></div>
  </div>

  <div id="place" class="clip" data-start="0" data-duration="4.49" data-track-index="4">
    <div class="place-inner">VELORIA RESIDENCES</div>
  </div>

  <div id="ticks" class="clip" data-start="0" data-duration="4.49" data-track-index="5">
    <div class="tick" data-i="0"></div>
    <div class="tick" data-i="1"></div>
    <div class="tick" data-i="2"></div>
    <div class="tick" data-i="3"></div>
    <div class="tick" data-i="4"></div>
    <div class="tick gold" data-i="5"></div>
  </div>
</div>

<script>
  document.fonts.ready.then(() => {
    const tl = gsap.timeline({ paused: true });
    const local = 0; // scene starts at film 0

    // frame 0 is the thumbnail: hook elements ride in with `from` only (never invisible at t=0)
    tl.from(".ovl-inner", { y: 18, duration: 0.4, ease: "power3.out" }, 0.0);
    tl.from(".big6-inner", { y: 90, scale: 0.94, transformOrigin: "50% 80%", duration: 0.62, ease: "power4.out" }, 0.0);
    tl.from("#v-label .v-label-inner", { y: 24, duration: 0.45, ease: "power3.out" }, 0.28);
    tl.from("#place .place-inner", { y: 22, duration: 0.4, ease: "power3.out" }, 3.5);

    // five ink ticks land on the half-beat grid
    const ticks = document.querySelectorAll(".tick");
    [1.5, 1.82, 2.12, 2.43, 2.7].forEach((t, i) => {
      tl.fromTo(ticks[i], { autoAlpha: 0, scaleY: 0.2, transformOrigin: "50% 100%" },
        { autoAlpha: 1, scaleY: 1, duration: 0.3, ease: "back.out(1.7)" }, t);
    });

    // the sixth — gold — with the word "six" (film 2.83)
    tl.fromTo(".tick.gold", { autoAlpha: 0, scaleY: 0.2, transformOrigin: "50% 100%" },
      { autoAlpha: 1, scaleY: 1, duration: 0.36, ease: "back.out(1.9)" }, 2.83);

    window.__timelines = window.__timelines || {};
    window.__timelines["hook"] = tl;
  });
</script>
</body>
</html>
