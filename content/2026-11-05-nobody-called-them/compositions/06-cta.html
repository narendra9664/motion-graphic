<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="../assets/fonts.css" />
<link rel="stylesheet" href="../assets/brand.css" />
<script src="../assets/gsap.min.js"></script>
<style>
  /* 06-cta — calm cream end card. Film window: 27.12 – 34.5 (local = film - 27.12)
     VO: "Book your free lead-flow audit." 0 – 2.49 · "@frontdesk.ops" 2.49 – 3.9 · hold to 7.38.
     The spoken words appear verbatim on screen, so no caption pill in this scene.
     All type ends by 1120px; the caption belt below stays clear. */
  #cta-root { font-family: "inter-variable", sans-serif; color: var(--ink); }

  #ovl { left: 90px; top: 430px; }

  #claim {
    left: 90px;
    top: 560px;
    width: 900px;
  }
  .cl {
    font-family: "anton", sans-serif;
    font-size: 96px;
    line-height: 1.06;
    text-transform: uppercase;
  }
  .cl .dim { color: var(--dim); }

  #card {
    left: 90px;
    top: 950px;
    width: 900px;
    height: 178px;
  }
  .card-inner {
    height: 100%;
    padding: 28px 34px;
    background: var(--ink);
    border-radius: 24px;
    box-shadow: 0 26px 60px rgba(17, 17, 17, 0.22);
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .c-left { min-width: 0; }
  .c-kicker {
    font-family: "anton", sans-serif;
    font-size: 44px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #EDEDE6;
  }
  .c-main {
    font-family: "anton", sans-serif;
    font-size: 62px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--paper);
    margin-top: 4px;
  }
  .c-right {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }
  .dm {
    padding: 12px 24px;
    border-radius: 999px;
    background: var(--blue);
    color: #FFFFFF;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.12em;
  }
  .handle {
    font-weight: 600;
    font-size: 28px;
    color: rgba(255, 255, 255, 0.85);
    font-variant-numeric: tabular-nums;
  }

  #bg { inset: 0; }
</style>
</head>
<body>
<div id="cta-root" data-composition-id="cta" data-start="0" data-duration="7.38" data-width="1080" data-height="1920">
  <div id="bg" class="clip" data-start="0" data-duration="7.38" data-track-index="0">
    <div style="position:absolute;inset:0;background:var(--ground);"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(640px 640px at 50% 34%, rgba(255,215,0,0.07), transparent 70%);"></div>
  </div>

  <div id="ovl" class="clip" data-start="0" data-duration="7.38" data-track-index="1">
    <div class="overline ovl-inner">FRONTDESK AI</div>
  </div>

  <h1 id="claim" class="clip" data-start="0" data-duration="7.38" data-track-index="2">
    <div class="cl cl-a">YOUR NEXT BUYER</div>
    <div class="cl cl-b">IS ALREADY <span class="dim">IN</span></div>
    <div class="cl cl-c">YOUR DATA.</div>
  </h1>

  <div id="card" class="clip" data-start="0" data-duration="7.38" data-track-index="3">
    <div class="card-inner">
      <div class="c-left">
        <div class="c-kicker">BOOK YOUR FREE</div>
        <div class="c-main">LEAD-FLOW AUDIT</div>
      </div>
      <div class="c-right">
        <span class="dm">DM AUDIT</span>
        <span class="handle">@frontdesk.ops</span>
      </div>
    </div>
  </div>
</div>

<script>
  document.fonts.ready.then(() => {
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#ovl .ovl-inner", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.1);

    // claim builds with "Book your free lead-flow audit." — pop sfx at film 27.3 = local 0.18
    tl.fromTo(".cl-a", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power4.out" }, 0.2);
    tl.fromTo(".cl-b", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power4.out" }, 0.4);
    tl.fromTo(".cl-c", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power4.out" }, 0.6);

    // CTA card with "@frontdesk.ops" (film 29.42)
    tl.fromTo("#card .card-inner", { autoAlpha: 0, y: 70, scale: 0.97 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "power4.out" }, 2.3);
    tl.fromTo(".dm", { scale: 0.85, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.36, ease: "back.out(1.8)", delay: 0.35 }, 2.3);

    window.__timelines = window.__timelines || {};
    window.__timelines["cta"] = tl;
  });
</script>
</body>
</html>
