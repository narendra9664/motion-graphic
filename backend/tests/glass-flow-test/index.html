    <meta charset="UTF-8" />

    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #eef3fb;
        --ink: #0e2244;
        --dim: #5b6b88;
        --accent: #1f5eff;
        --blob-a: #2a63f6;
        --blob-b: #7aa8ff;
        --blob-c: #c4d8ff;
        --wa: #25d366;
        --wa-bubble: #dcf8c6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: "Inter", sans-serif;
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* frosted glass, as the reference uses it */
      .glass {
        background: rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        backdrop-filter: blur(24px) saturate(140%);
        border: 1.5px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          0 30px 60px rgba(30, 70, 160, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .solid-card {
        background: #ffffff;
        border: 1.5px solid rgba(14, 34, 68, 0.08);
        box-shadow: 0 30px 70px rgba(30, 70, 160, 0.16);
      }
      .w {
        display: inline-block;
        white-space: pre;
      }
      .cursor-svg {
        width: 46px;
        height: 46px;
        filter: drop-shadow(0 4px 6px rgba(14, 34, 68, 0.3));
      }
    </style>
  </head>
