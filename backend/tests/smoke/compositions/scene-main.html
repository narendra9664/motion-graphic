<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="../assets/fonts.css" />
<script src="../assets/gsap.min.js"></script>
<style>
  /* scene-main — frontdesk AI brand tokens: cream ground, ink, WhatsApp chip, blue/gold score */
  :root {
    --ground: #F5F5F0;
    --ink: #111111;
    --ink-dim: #6E6E66;
    --wa-green: #D9FDD3;
    --wa-ink: #0B2B14;
    --blue: #0080FF;
    --gold: #FFD700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--ground);
  }
  #scene-root {
    position: relative;
    width: 100%;
    height: 100%;
    font-family: "inter-variable", sans-serif;
    color: var(--ink);
  }
  .clip { position: absolute; }
  .bg { inset: 0; }

  #headline { left: 90px; top: 700px; width: 900px; }
  .hl {
    font-family: "anton", sans-serif;
    font-weight: 400;
    font-size: 148px;
    line-height: 1.03;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .hl .dim { color: var(--ink-dim); }

  #screen-label { left: 90px; top: 1052px; }
  .lbl {
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  #chip { left: 90px; top: 1120px; }
  .chip-inner {
    max-width: 900px;
    padding: 30px 42px;
    border-radius: 14px 26px 26px 26px;
    background: var(--wa-green);
    color: var(--wa-ink);
    font-weight: 600;
    font-size: 40px;
    line-height: 1.25;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06), inset 0 -2px 0 rgba(0, 0, 0, 0.08);
  }

  #score { right: 70px; top: 1002px; width: 160px; height: 160px; }
  .score-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 66px;
  }
  .score-inner b { color: var(--gold); font-variant-numeric: tabular-nums; }

  #line2 { left: 90px; top: 1420px; width: 900px; }
  .line2-inner { font-weight: 600; font-size: 54px; line-height: 1.2; }

  #brand { left: 90px; bottom: 120px; }
  .brand-inner {
    font-family: "anton", sans-serif;
    font-size: 46px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .brand-inner span { color: var(--blue); }
</style>
</head>
<body>
<div
  id="scene-root"
  data-composition-id="scene-main"
  data-start="0"
  data-duration="5"
  data-width="1080"
  data-height="1920"
>
  <div id="bg" class="clip bg" data-start="0" data-duration="5" data-track-index="0"></div>

  <h1 id="headline" class="clip" data-start="0.3" data-duration="4.7" data-track-index="1">
    <div class="hl">NOBODY<br /><span class="dim">CALLED</span> THEM.</div>
  </h1>

  <div id="screen-label" class="clip" data-start="1.4" data-duration="3.6" data-track-index="2">
    <div class="lbl">HOT LEAD &middot; VELORIA RESIDENCES</div>
  </div>

  <div id="chip" class="clip" data-start="1.6" data-duration="3.4" data-track-index="3">
    <div class="chip-inner">Six visits this week &middot; Sky Penthouse A-4 &middot; floor plans downloaded</div>
  </div>

  <div id="score" class="clip" data-start="1.6" data-duration="3.4" data-track-index="4">
    <div class="score-inner"><b id="scoreNum">0</b></div>
  </div>

  <div id="line2" class="clip" data-start="2.8" data-duration="2.2" data-track-index="5">
    <div class="line2-inner">FrontDesk AI. Somebody always does.</div>
  </div>

  <div id="brand" class="clip" data-start="0" data-duration="5" data-track-index="6">
    <div class="brand-inner">FRONTDESK <span>AI</span></div>
  </div>
</div>

<script>
  document.fonts.ready.then(() => {
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(".hl", { y: 78, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out" }, 0.3);
    tl.fromTo("#screen-label .lbl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 1.4);
    tl.fromTo("#chip .chip-inner", { y: 40, scale: 0.96, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.42, ease: "back.out(1.6)" }, 1.6);
    tl.fromTo("#score .score-inner", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.6);

    const num = { v: 0 };
    const el = document.getElementById("scoreNum");
    tl.to(num, { v: 94, duration: 0.9, ease: "power2.out", onUpdate: () => { el.textContent = String(Math.round(num.v)); } }, 1.7);

    tl.fromTo("#line2 .line2-inner", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 2.8);
    tl.set({}, {}, 5);

    window.__timelines = window.__timelines || {};
    window.__timelines["scene-main"] = tl;
  });
</script>
</body>
</html>
